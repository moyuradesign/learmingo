name: Readiness workspace
on: [push, pull_request]
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: find app routes resources/views -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/readiness.php
      - run: node --check public/assets/js/readiness.js
